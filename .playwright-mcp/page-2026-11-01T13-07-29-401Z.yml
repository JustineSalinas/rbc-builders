            - generic [ref=e153]:
              - paragraph [ref=e154]: Most home building projects stumble over the historic disconnect between creative designers and general contractors. An independent architect drafts a vision without direct accountability for construction costs; the builder inherits plans they must interpret; and the homeowner absorbs the expensive fallout of variation orders and delayed permits.
              - paragraph [ref=e155]:
                - text: RBC Builders operates on an integrated
                - strong [ref=e156]: Design-Build
                - text: methodology. Our architects, civil engineers, project supervisors, and permit officers work side by side under one roof. We draft with structural awareness, build with precision, and stand behind our work for decades to come.
            - generic [ref=e157]:
              - generic [ref=e158]:
                - heading "Unified Design-Build Accountability" [level=3] [ref=e163]
                - paragraph [ref=e164]: No friction between separate architects and general contractors. From initial structural blueprints to the final interior coat, a single accountable builder is responsible for your investment.
              - generic [ref=e165]:
                - heading "Precise Cost Engineering (No Variations)" [level=3] [ref=e170]
                - paragraph [ref=e171]: Every design decision is cross-referenced against realistic material costs and labor indices before groundbreaking. We build according to an itemized, transparent Bill of Quantities.
              - generic [ref=e172]:
                - heading "Government Permit Handling" [level=3] [ref=e175]
                - paragraph [ref=e176]: We manage barangay and municipal permit requirements on your behalf, so your project stays compliant from groundbreaking to turnover.
              - generic [ref=e177]:
                - heading "Quality Material Finishes" [level=3] [ref=e181]
                - paragraph [ref=e182]: From Bare Finish to Luxury specification tiers, materials are sourced to match the quality level you choose and sign off on.
            - link "Explore Full Design-Build Capabilities" [ref=e184] [cursor=pointer]:
              - /url: "#services"
